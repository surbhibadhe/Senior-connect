
spring.application.name=SeniorConnect

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/seniorconnect_db
spring.datasource.username=postgres
spring.datasource.password=surbhi

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.google.client-id=608136478515-756votpmcohlnc626iju007jm6g8aats.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional local properties (gitignored - holds local secret)
spring.config.import=optional:classpath:application-local.properties

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG


# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# Directory for uploaded files
app.upload.dir=uploads

# Error handling
server.error.include-stacktrace=never
server.error.include-message=always

